name: lokum

services:
  php:
    build:
      context: ./docker/php
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./apps/api:/var/www/api
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.30-alpine
    ports:
      # 127.0.0.1 = this machine only; set API_BIND=0.0.0.0 to reach the API from a phone on the same Wi-Fi
      - ${API_BIND:-127.0.0.1}:${API_PORT:-8000}:80
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api:/var/www/api:ro
    depends_on:
      - php
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lokum}
      POSTGRES_USER: ${POSTGRES_USER:-lokum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokum}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      # Since PostgreSQL 18 the image stores data in /var/lib/postgresql/<major>/docker,
      # so the volume is mounted one level higher than in older versions.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - 127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025
    restart: unless-stopped

volumes:
  db_data:
